<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Trace gallery</title>
<script>
// Same theme rule as the app: saved choice, else the system's.
(function () {
  var t = 'light';
  try {
    t = localStorage.getItem('qt-theme');
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  } catch (_) { /* storage blocked: stay light */ }
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
  :root {
    color-scheme: light;
    --paper: #FAF6EF; --text: #7a6f60; --card: #fff; --frame: #eee; --track: #EFE8DD; --dash: #C9BFB0;
    --toggle-fg: #8A7E6E; --toggle-bg: rgba(90, 70, 50, .08);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #1E1A16; --text: #B5AA9A; --card: #26211C; --frame: #3A332B; --track: #2D2721; --dash: #6B6054;
    --toggle-fg: #C9BFB0; --toggle-bg: rgba(255, 255, 255, .08);
  }
  body { margin: 0; padding: 16px; background: var(--paper); font: 12px/1.3 system-ui, sans-serif; color: var(--text); }
  h2 { margin: 18px 0 8px; font-size: 14px; font-weight: 600; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  figure { margin: 0; text-align: center; }
  canvas { background: var(--card); border-radius: 8px; display: block; }
  #theme { position: fixed; top: 14px; right: 14px; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--toggle-bg); color: var(--toggle-fg); cursor: pointer; }
  #theme svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #theme .moon, :root[data-theme="dark"] #theme .sun { display: none; }
  :root[data-theme="dark"] #theme .moon { display: block; }
</style>
</head>
<body>
<button id="theme" type="button" aria-label="Toggle dark mode">
  <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
</button>
<p id="count"></p>
<div id="out"></div>
<script src="../shapes.js"></script>
<script>
  // Development only: every item with its track, dashed guide, sample points and start dot.
  const SIZE = +(new URLSearchParams(location.search).get('size') || 150), DPR = window.devicePixelRatio || 1;
  const only = new URLSearchParams(location.search).get('cat');
  function render() {
  const css = getComputedStyle(document.documentElement);
  const FRAME = css.getPropertyValue('--frame').trim(), TRACK = css.getPropertyValue('--track').trim(), DASH = css.getPropertyValue('--dash').trim();
  out.textContent = '';
  let n = 0;
  for (const [cat, group] of Object.entries(QT.items)) {
    const h = document.createElement('h2');
    h.textContent = `${cat} (${Object.keys(group).length})`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    out.append(h, grid);
    if (only && only !== cat) { h.remove(); grid.remove(); continue; }
    for (const [name, d] of Object.entries(group)) {
      n++;
      const fig = document.createElement('figure');
      const cv = document.createElement('canvas');
      cv.width = cv.height = SIZE * DPR;
      cv.style.width = cv.style.height = SIZE + 'px';
      const cap = document.createElement('figcaption');
      cap.textContent = name;
      fig.append(cv, cap);
      grid.append(fig);
      const ctx = cv.getContext('2d');
      ctx.setTransform(DPR * SIZE / 100, 0, 0, DPR * SIZE / 100, 0, 0);
      ctx.strokeStyle = FRAME; ctx.lineWidth = 0.4; ctx.strokeRect(0, 0, 100, 100);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const subs = QT.measure(d, 1.5);
      for (const s of subs) {
        const p = new Path2D(s.d);
        ctx.strokeStyle = TRACK; ctx.lineWidth = 6.5; ctx.stroke(p);
        ctx.strokeStyle = DASH; ctx.lineWidth = 1.6; ctx.setLineDash([2.8, 3.2]); ctx.stroke(p); ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(91,141,239,.55)';
        for (const q of s.pts) { ctx.beginPath(); ctx.arc(q.x, q.y, 0.45, 0, 7); ctx.fill(); }
      }
      const s0 = subs[0].pts[0];
      ctx.fillStyle = '#F28B9B'; ctx.beginPath(); ctx.arc(s0.x, s0.y, 2.2, 0, 7); ctx.fill();
    }
  }
  count.textContent = `${n} items`;
  }
  render();

  function setTheme(name, save) {
    document.documentElement.dataset.theme = name;
    if (save) { try { localStorage.setItem('qt-theme', name); } catch (_) { /* not fatal */ } }
    render();
  }
  theme.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    let saved = null;
    try { saved = localStorage.getItem('qt-theme'); } catch (_) { /* ignore */ }
    if (!saved) setTheme(e.matches ? 'dark' : 'light', false);
  });
</script>
</body>
</html>
