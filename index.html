<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Quiet Trace</title>
<meta name="description" content="A quiet tracing game. Pick a colour. Trace. That's all.">
<meta name="theme-color" content="#FAF6EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiet Trace">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<script>
// Pick the theme before first paint so there is no light flash: saved choice, else the system's.
(function () {
  var t = 'light';
  try {
    t = localStorage.getItem('qt-theme');
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  } catch (_) { /* storage blocked: stay light */ }
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#1E1A16' : '#FAF6EF';
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="picker" class="screen on" aria-label="Choose a colour">
  <div id="swatches"></div>
</main>
<section id="stage" class="screen" aria-label="Tracing">
  <div id="art" class="hide">
    <canvas id="guide"></canvas>
    <canvas id="ink"></canvas>
    <canvas id="fx"></canvas>
  </div>
  <div id="exit"></div>
</section>
<button id="theme" type="button" aria-label="Switch to dark mode" aria-pressed="false">
  <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
</button>
<script src="shapes.js"></script>
<script src="app.js"></script>
</body>
</html>
